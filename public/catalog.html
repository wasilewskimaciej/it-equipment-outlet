<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IT Equipment Outlet - Katalog</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="header">
    <h1>IT Equipment Outlet</h1>
    <div class="header-right">
      <button class="theme-toggle" onclick="toggleTheme()" title="Zmień motyw">
        <span class="icon-sun">&#9728;</span>
        <span class="icon-moon">&#9790;</span>
      </button>
      <span class="user-info" id="userInfo"></span>
      <a href="/admin.html" id="adminLink" class="btn btn-secondary" style="display: none;">Panel Admina</a>
      <form action="/auth/logout" method="POST" class="inline-form">
        <button type="submit" class="btn btn-secondary">Wyloguj</button>
      </form>
    </div>
  </header>

  <main class="container">
    <!-- My Reservations -->
    <section id="myReservationsSection" class="admin-section" style="display: none;">
      <h2>Moje rezerwacje</h2>
      <div id="myReservationsContainer"></div>
    </section>

    <h2 style="margin-bottom: 1rem;">Dostępny sprzęt</h2>
    <div class="filters">
      <input type="text" id="searchInput" placeholder="Szukaj...">
      <select id="categoryFilter">
        <option value="">Wszystkie kategorie</option>
        <option value="phone">Telefony komórkowe</option>
        <option value="desktop">Komputery stacjonarne</option>
        <option value="laptop">Laptopy</option>
        <option value="monitor">Monitory</option>
        <option value="other">Inne</option>
      </select>
      <label class="filter-checkbox">
        <input type="checkbox" id="favoritesFilter">
        <span class="filter-checkbox-icon">♥</span>
        <span>Tylko ulubione</span>
      </label>
      <select id="sortFilter" class="sort-filter">
        <option value="newest">Najnowsze</option>
        <option value="oldest">Najstarsze</option>
        <option value="price_asc">Cena: rosnąco</option>
        <option value="price_desc">Cena: malejąco</option>
      </select>
    </div>

    <div id="itemsContainer" class="items-grid">
      <div class="loading">Ładowanie...</div>
    </div>
  </main>

  <!-- Item Details Modal -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal modal-large">
      <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
      <div class="item-details">
        <div class="item-gallery">
          <div class="gallery-main">
            <img id="detailsMainImage" src="" alt="" onclick="openLightbox()" style="cursor: zoom-in;">
            <button class="gallery-nav gallery-prev" onclick="prevImage()">&#10094;</button>
            <button class="gallery-nav gallery-next" onclick="nextImage()">&#10095;</button>
          </div>
          <div class="gallery-thumbnails" id="detailsThumbnails"></div>
        </div>
        <div class="item-info">
          <span class="item-category" id="detailsCategory"></span>
          <h2 id="detailsName"></h2>
          <div class="item-price" id="detailsPrice"></div>
          <div class="item-favorite-count" id="detailsFavoriteCount" style="display: none;">
            <span class="favorite-count-icon">♥</span>
            <span class="favorite-count-text"></span>
          </div>
          <div class="item-quantity-info" id="detailsQuantity" style="display: none;">
            Dostępne: <strong id="detailsQuantityValue"></strong> szt.
          </div>
          <div class="item-full-description" id="detailsDescription"></div>
          <button class="btn btn-primary btn-lg" id="detailsReserveBtn">Zarezerwuj</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-overlay" id="lightboxModal">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxPrev()">&#10094;</button>
    <img class="lightbox-image" id="lightboxImage" src="" alt="">
    <button class="lightbox-nav lightbox-next" onclick="lightboxNext()">&#10095;</button>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>

  <!-- Reservation Modal -->
  <div class="modal-overlay" id="reserveModal">
    <div class="modal">
      <h3>Potwierdź rezerwację</h3>
      <p>Czy na pewno chcesz zarezerwować: <strong id="reserveItemName"></strong>?</p>
      <p style="margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">
        Po rezerwacji skontaktujemy się z Tobą w celu ustalenia szczegółowych warunków odbioru i płatności.
      </p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeReserveModal()">Anuluj</button>
        <button class="btn btn-success" id="confirmReserveBtn">Zarezerwuj</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
